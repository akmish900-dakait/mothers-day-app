<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.png" />
    <title>Our Vision Board</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { margin: 0; background-color: #ffffff; -webkit-tap-highlight-color: transparent; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Vacation Config: May 30 to June 15
      const VAC_START = new Date(2026, 4, 30); 
      const VAC_END = new Date(2026, 5, 15);

      function App() {
        const [chores, setChores] = useState([]);
        const [defaults, setDefaults] = useState(() => {
          const saved = localStorage.getItem("my_defaults");
          return saved ? JSON.parse(saved) : [{ id: 1, name: "Morning Tea", s: "06:30", cat: "Kitchen" }];
        });
        const [isHoliday, setIsHoliday] = useState(false);
        const [isVacation, setIsVacation] = useState(false);
        const [tiredId, setTiredId] = useState(null);

        useEffect(() => {
          const now = new Date();
          if (now >= VAC_START && now <= VAC_END) {
            setIsVacation(true);
            setChores([]);
          } else {
            setChores([...defaults]);
          }
          if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
        }, [defaults]);

        const triggerNotify = (title, body, timeStr) => {
          if (!timeStr) return;
          const [h, m] = timeStr.split(":").map(Number);
          const target = new Date();
          target.setHours(h, m, 0);
          const delay = target.getTime() - Date.now();

          if (delay > 0) {
            setTimeout(() => {
              if (Notification.permission === "granted") {
                navigator.serviceWorker.ready.then(reg => {
                  reg.showNotification(title, { body, icon: "icon.png" });
                });
              }
            }, delay);
          }
        };

        const addItem = (name, time, saveDefault) => {
          if (!name || !time) return;
          const item = { id: Date.now(), name, s: time, cat: isVacation ? "Travel" : "Kitchen" };
          if (saveDefault) {
            const newDefs = [...defaults, item];
            setDefaults(newDefs);
            localStorage.setItem("my_defaults", JSON.stringify(newDefs));
          } else {
            setChores([...chores, item]);
          }

          const [h, m] = time.split(":").map(Number);
          triggerNotify("Reminder", `${name} in 15 mins`, `${h}:${m-15}`);
          triggerNotify("Task Start", `Time for ${name}`, time);
        };

        const assignAdi = (c) => {
          window.location.href = `sms:Adi&body=${encodeURIComponent("Hey Adi, can you do: " + c.name + " at " + c.s + "?")}`;
          setTiredId(null);
        };

        return (
          <div style={{ padding: "20px", fontFamily: "'Jost', sans-serif", maxWidth: "450px", margin: "auto" }}>
            <h1 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: "32px", marginBottom: "5px" }}>
              {isVacation ? "🏖️ Vacation Mode" : "Our Vision Board"}
            </h1>
            <p style={{ fontSize: "12px", color: "#888", marginBottom: "20px" }}>{new Date().toDateString()}</p>
            
            {!isVacation && !isHoliday && (
              <button onClick={() => { setIsHoliday(true); setChores([]); }} 
                style={{ width: "100%", padding: "12px", background: "#f0fdf4", color: "#166534", border: "none", borderRadius: "12px", marginBottom: "20px", fontWeight: "500" }}>
                🏖️ Today is a Holiday
              </button>
            )}

            <div style={{ minHeight: "150px" }}>
              {isHoliday ? <p style={{ textAlign: "center", color: "#666" }}>Enjoy your holiday rest! 🍦</p> : chores.map(c => (
                <div key={c.id} style={{ display: "flex", justifyContent: "space-between", padding: "15px", background: "#fff", borderRadius: "14px", marginBottom: "10px", border: "1px solid #eee", boxShadow: "0 2px 5px rgba(0,0,0,0.03)" }}>
                  <div>
                    <div style={{ fontWeight: "500" }}>{c.name}</div>
                    <div style={{ fontSize: "12px", color: "#1D9E75" }}>⏰ {c.s}</div>
                  </div>
                  <button onClick={() => setTiredId(c.id)} style={{ background: "#FBEAF0", color: "#72243E", border: "none", borderRadius: "8px", padding: "5px 12px", fontSize: "11px" }}>Tired?</button>
                </div>
              ))}
            </div>

            <div style={{ marginTop: "30px", background: "#f9f9f9", padding: "20px", borderRadius: "16px" }}>
              <input id="tn" placeholder={isVacation ? "Tourist Spot..." : "New Task..."} style={{ width: "100%", padding: "12px", marginBottom: "10px", borderRadius: "10px", border: "1px solid #ddd", boxSizing: "border-box" }} />
              <div style={{ display: "flex", gap: "10px", marginBottom: "10px" }}>
                <input id="tt" type="time" style={{ padding: "10px", borderRadius: "10px", border: "1px solid #ddd" }} />
                <button onClick={() => addItem(document.getElementById('tn').value, document.getElementById('tt').value, false)} style={{ flex: 1, background: "#000", color: "#fff", border: "none", borderRadius: "10px", fontWeight: "500" }}>Add Task</button>
              </div>
              <button onClick={() => addItem(document.getElementById('tn').value, document.getElementById('tt').value, true)} style={{ width: "100%", background: "none", border: "1px solid #ddd", color: "#666", padding: "8px", borderRadius: "10px", fontSize: "12px" }}>Save as Everyday Task</button>
            </div>

            {tiredId && (
              <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", padding: "20px", zIndex: 1000 }}>
                <div style={{ background: "#fff", padding: "25px", borderRadius: "24px", width: "100%", textAlign: "center" }}>
                  <h3 style={{ fontFamily: "'Cormorant Garamond', serif", marginTop: 0 }}>Options</h3>
                  <button onClick={() => assignAdi(chores.find(x => x.id === tiredId))} style={{ width: "100%", padding: "16px", background: "#1D9E75", color: "#fff", borderRadius: "12px", border: "none", fontWeight: "600", marginBottom: "10px" }}>Assign to Adi (iMessage)</button>
                  <button onClick={() => setTiredId(null)} style={{ background: "none", border: "none", color: "#888" }}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // THE KEY FIX: Actually rendering the app
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
